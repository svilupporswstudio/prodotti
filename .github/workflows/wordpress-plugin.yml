name: WordPress Plugin CI, ZIP & SVN Deploy

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  php-lint-and-headers:
    name: PHP 8.3 Syntax & Plugin Metadata Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: none

      - name: Check PHP syntax across all plugin files
        run: |
          echo "Verifica sintassi PHP ${{ matrix.php-version }}..."
          find prodotti -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Verify WordPress plugin headers, readme.txt & .svnignore
        run: |
          test -f .svnignore
          grep -q "Requires at least: 7.0" prodotti/prodotti.php
          grep -qE "Tested up to:\s+7\.2" prodotti/prodotti.php
          grep -qE "Requires PHP:\s+8\.3" prodotti/prodotti.php
          grep -qE "Requires Plugins:\s+meta-box" prodotti/prodotti.php
          grep -q "Requires at least: 7.0" prodotti/readme.txt
          grep -q "Tested up to: 7.2" prodotti/readme.txt
          grep -q "Requires PHP: 8.3" prodotti/readme.txt
          grep -q "Requires Plugins: meta-box" prodotti/readme.txt
          echo "Metadata WordPress 7.0 - 7.2, PHP 8.3 e .svnignore verificati con successo."

  build-plugin-zip:
    name: Build WordPress Plugin Archive
    runs-on: ubuntu-latest
    needs: php-lint-and-headers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create distributable prodotti.zip excluding .svnignore patterns
        run: |
          mkdir -p dist
          zip -r dist/prodotti.zip prodotti -x@.svnignore
          ls -lh dist/prodotti.zip

      - name: Upload plugin ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: prodotti-wordpress-plugin
          path: dist/prodotti.zip
          retention-days: 30

      - name: Attach ZIP to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/prodotti.zip

  deploy-wp-org:
    name: Deploy to WordPress.org Plugin Directory (SVN)
    runs-on: ubuntu-latest
    needs: build-plugin-zip
    if: startsWith(github.ref, 'refs/tags/v') && vars.WP_ORG_DEPLOY_ENABLED == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare clean plugin directory using .svnignore
        run: |
          mkdir -p wp-org-build
          rsync -av --exclude-from=.svnignore prodotti/ wp-org-build/

      - name: WordPress.org Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: prodotti
          BUILD_DIR: wp-org-build
